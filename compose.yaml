services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    # Map the current working directory on the host to /data in the container
    volumes:
      - .:/data
      # Add a named volume to cache whisper models and prevent re-downloading
      - whisper_cache:/root/.cache/whisper
    # Use host network mode so the container can easily reach the host's Ollama instance at localhost:11434
    # Note: host network proxying varies by OS. Alternative: extra_hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434

volumes:
  whisper_cache:
